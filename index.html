<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Kapellen 1 — Schnell-Erfassung (Supabase)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 9px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background: rgba(15, 23, 42, 0.3);
        }

        legend {
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: bold;
            padding: 0 6px;
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .success-msg {
            margin-top: 10px;
            text-align: center;
            color: var(--success);
            font-size: 0.9rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 TV Kapellen 1 — Schnell-Erfassung</h2>

    <div id="formSection">
        <div class="grid-3">
            <div class="form-group">
                <label for="spieltag">Spieltag Nr.</label>
                <input type="number" id="spieltag" readonly style="background:#111827; color:#34d399; font-weight:bold;">
            </div>
            <div class="form-group">
                <label for="matchDate">Datum auswählen</label>
                <select id="matchDate" onchange="onDateChange()"></select>
            </div>
            <div class="form-group">
                <label for="endergebnisTeam">Endstand Team</label>
                <input type="text" id="endergebnisTeam" value="12:8" placeholder="z.B. 12:8">
            </div>
        </div>

        <div class="form-group">
            <label for="opponentTeam">Gegner Mannschaft (Auto)</label>
            <input type="text" id="opponentTeam" readonly style="color: var(--accent); background: #111827; font-weight:bold;">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="block">Block</label>
                <select id="block" onchange="onBlockChange()">
                    <option value="1. Block - Einzel (1-8)">1. Block - Einzel (1-8)</option>
                    <option value="Doppel">Doppel (1-4)</option>
                    <option value="2. Block - Einzel (9-16)">2. Block - Einzel (9-16)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="matchNumber">Partie-Nummer im Block</label>
                <select id="matchNumber"></select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group" id="groupPlayer1">
                <label id="labelPlayer1" for="playerKapellen">Spieler Kapellen 1</label>
                <select id="playerKapellen"></select>
            </div>
            <div class="form-group" id="groupPlayer2" style="display: none;">
                <label for="playerKapellen2">2. Spieler Kapellen (Doppelpartner)</label>
                <select id="playerKapellen2"></select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label id="labelOpponent1" for="opponentPlayer">Gegner Name 1</label>
                <select id="opponentPlayer"></select>
            </div>
            <div class="form-group" id="groupOpponent2" style="display: none;">
                <label for="opponentPlayer2">Gegner Name 2 (Doppelpartner)</label>
                <select id="opponentPlayer2"></select>
            </div>
        </div>

        <fieldset>
            <legend>Spieldaten</legend>
            <div class="grid-3">
                <div class="form-group">
                    <label for="ergebnisSpiel">Ergebnis</label>
                    <input type="text" id="ergebnisSpiel" value="3:1" placeholder="3:1">
                </div>
                <div class="form-group">
                    <label for="avg">Average</label>
                    <input type="number" step="0.01" id="avg" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="darts">Darts pro Leg</label>
                    <input type="text" id="darts" placeholder="32,25,18">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Scores & Highlights</legend>
            <div class="grid-3">
                <div class="form-group"><label for="s60">60+</label><input type="number" id="s60" value="0"></div>
                <div class="form-group"><label for="s80">80+</label><input type="number" id="s80" value="0"></div>
                <div class="form-group"><label for="s100">100+</label><input type="number" id="s100" value="0"></div>
            </div>
            <div class="grid-3" style="margin-top: 8px;">
                <div class="form-group"><label for="s140">140+</label><input type="number" id="s140" value="0"></div>
                <div class="form-group"><label for="count180">180er</label><input type="number" id="count180" value="0"></div>
                <div class="form-group"><label for="hf">High Finish (HF)</label><input type="number" id="hf" value="0"></div>
            </div>
        </fieldset>

        <button onclick="saveToSupabase(event)">💾 In Supabase Speichern (Team 1)</button>
        <div id="successMsg" class="success-msg">✓ Match erfolgreich für Team 1 gespeichert!</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://lhusylpjnujlqomougmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yXEueWILvAq-Vm2VfTuYyg_BIQeE1KK';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const teamKader = [
        "Patrick Seitz", "Sascha Bien", "Tim Siegel", "Dominik Herz", "Dirk Kraus", "Jan Krabbe", "Stefan Melcher", "Denis Vanzidler", "Robert Geyer", "Fabio Padovano", "Dominik Helmke", "Joel Wielinski"
    ];

    const schedule = {
        "2026-09-06": "Rumelner TV 2",
        "2026-09-19": "Kaiser Dart Aachen 3",
        "2026-09-26": "SDC Dart Vaders Kempen",
        "2026-10-10": "1. Dart Club Lobberich 1988 e.V. 3",
        "2026-10-24": "Hot Shots Neuss 3",
        "2026-11-07": "1. Dartsportverein Jülich e.V.",
        "2026-11-14": "1. SDVW Ocky Bullboa e.V. 1",
        "2026-11-28": "Kaiser Dart Aachen 2",
        "2027-01-09": "Dart Simpsons",
        "2027-01-23": "Rumelner TV 2",
        "2027-02-06": "Kaiser Dart Aachen 3",
        "2027-02-20": "SDC Dart Vaders Kempen",
        "2027-03-06": "1. Dart Club Lobberich 1988 e.V. 3",
        "2027-03-13": "Hot Shots Neuss 3",
        "2027-04-03": "1. Dartsportverein Jülich e.V.",
        "2027-04-24": "1. SDVW Ocky Bullboa e.V. 1",
        "2027-05-08": "Kaiser Dart Aachen 2",
        "2027-05-15": "Dart Simpsons"
    };

    const opponentRosters = {
        "1. Dart Club Lobberich 1988 e.V. 3": ["Susanne Königs", "Jacob Suckling", "Finja Pulcher", "Frank Dousen", "Florian Biskup", "Thomas Brüggen", "Susanne Dousen TC 1", "Heiner Lankes", "Lars Wermke", "Lukas Leven", "Dominik Höfer", "Michael Thoneick", "Simon Holzmann", "Frank Jansen", "Ingo Heidhausen", "Tim Thoneick", "Elke Lorenzen", "Erik Pulcher"],
        "1. Dartsportverein Jülich e.V.": ["Marvin Eschweiler", "Michael Schwill TC 1", "Torsten Müller", "Lars Schneider", "Martin Matusik", "Tobias Tanzmann", "Michael Tanzmann", "Fynn Julian Schiffer", "Jannick Kondziella TC 2", "Gianluca Brieden", "Stefan Grobelski", "Niklas Veltmann", "Tony Straube"],
        "1. SDVW Ocky Bullboa e.V. 1": ["Pascal Röbers", "Dennis Klüppelberg", "David Bienefeld TC 1", "Karl-Josef Werth", "Daniel Voß", "Michael Dulisse", "Daniel Königs", "David Feuster", "David Zeschin TC 2", "Friedhelm Schmitz", "Christopher Iliescu", "David Reibel", "Ivan Galic", "Bastian Blaum"],
        "Dart Simpsons": ["Jörg Kaden", "Stefan Baumann TC 1", "Ricardo Schaefer", "Helmut Bode", "Uwe Althoff", "Jürgen Cremer", "Uli Geelen", "Karlheinz Geerkens", "Niklas Schoppmann", "Max Fongern", "Patrick Gravendyk", "Tim Brauers", "Angela Thamer", "Christian Koppers", "Andreas Kawaters", "Cornel Schreuders", "Marius Angenendt", "Gudrun van der Bloemen TC 2"],
        "Hot Shots Neuss 3": ["Scott Robinson", "Robin Böser", "Johannes Kantert", "Florian Preuß TC 1", "Lena Heischeid TC 2", "Fabian Könnecke", "Dominik Schumacher", "Dominik Fleschhut", "Ben Jonas Eisleben", "Rene Michael Kuffel", "Henry Herrgesell", "Klaus Dohmen", "Fabian Eickholt", "David Schmitz", "Marco Hütges"],
        "Kaiser Dart Aachen 2": ["Tobias Dieteren", "Rene Töpfer", "Marc Reuschenberg", "Sebastian Lövenich", "Kevin Lennartz", "Andreas Neu TC 2", "Maurice Rhein", "Heinz-Peter Meessen", "Andre Geldner TC 1", "Jannick Schröder", "Pascal Daum", "Jan Töpfer", "Noah Schlak", "Christina Töpfer"],
        "Kaiser Dart Aachen 3": ["Dominik Lannott", "Michel Blaauw", "Heinz-Peter Meessen", "Mario Ragutt TC 2", "Jason Roder", "Nico Burhenne", "Can-Tim Huth", "Maurice Fraikin", "Romain Wetzels", "Paul Kraus", "Marvin Anders", "Tom Schweitzer", "Andreas Oebels TC 1"],
        "Rumelner TV 2": ["Mario Koske", "Marco Kolo TC 2", "Christoph Weber TC 1", "René Kasper", "Robin Bohres", "Mirko Ullrich", "Carsten Köhler", "Ben Weber", "Dirk Engelmann", "Felix Spiller", "Thorsten Krüger", "Jörg Abel", "Annalena Kolo", "Enrico Kausler", "Robert Bollmann", "Thorsten Knies", "Uwe Posner", "Andre Knauer"],
        "SDC Dart Vaders Kempen": ["Patrick Neuhaus", "Louis Plenker", "Ben Zemang", "Simon Schiller", "Elias Erdmann", "Markus Brendel", "Elias Spinczyk", "Sam Tober", "Oliver Drescher", "Markus Hoffmann", "Pascal Münks", "Kilian Petrache", "Olaf Müller", "Leo Loschelders", "Andre Hahnbück"]
    };

    document.addEventListener("DOMContentLoaded", () => {
        let dateSelect = document.getElementById("matchDate");
        dateSelect.innerHTML = "";
        let index = 1;
        for (let [date, opponent] of Object.entries(schedule)) {
            let opt = document.createElement("option");
            opt.value = date;
            opt.text = `Spieltag ${index} (${date}) - vs. ${opponent}`;
            opt.setAttribute("data-spieltag", index);
            opt.setAttribute("data-opponent", opponent);
            dateSelect.appendChild(opt);
            index++;
        }

        let p1 = document.getElementById("playerKapellen");
        let p2 = document.getElementById("playerKapellen2");
        p1.innerHTML = ""; p2.innerHTML = "";
        teamKader.forEach(p => {
            p1.innerHTML += `<option value="${p}">${p}</option>`;
            p2.innerHTML += `<option value="${p}">${p}</option>`;
        });

        onDateChange();
        onBlockChange();
    });

    function onDateChange() {
        let dateSelect = document.getElementById("matchDate");
        let selectedOpt = dateSelect.options[dateSelect.selectedIndex];
        if (!selectedOpt) return;

        document.getElementById("spieltag").value = selectedOpt.getAttribute("data-spieltag");
        let opponentTeam = selectedOpt.getAttribute("data-opponent");
        document.getElementById("opponentTeam").value = opponentTeam;

        let g1 = document.getElementById("opponentPlayer");
        let g2 = document.getElementById("opponentPlayer2");
        g1.innerHTML = ""; g2.innerHTML = "";
        let roster = opponentRosters[opponentTeam] || [];
        roster.forEach(p => {
            g1.innerHTML += `<option value="${p}">${p}</option>`;
            g2.innerHTML += `<option value="${p}">${p}</option>`;
        });
    }

    function onBlockChange() {
        let block = document.getElementById("block").value;
        let isDoppel = block.toLowerCase().includes("doppel");
        
        document.getElementById("groupPlayer2").style.display = isDoppel ? "block" : "none";
        document.getElementById("groupOpponent2").style.display = isDoppel ? "block" : "none";

        let partieSelect = document.getElementById("matchNumber");
        partieSelect.innerHTML = "";
        let maxPartien = isDoppel ? 4 : 8;
        for (let i = 1; i <= maxPartien; i++) {
            let prefix = isDoppel ? "Doppel" : "Einzel";
            partieSelect.innerHTML += `<option value="${prefix} ${i}">${prefix} ${i}</option>`;
        }
    }

    async function saveToSupabase(event) {
        let dateSelect = document.getElementById("matchDate");
        let selectedOpt = dateSelect.options[dateSelect.selectedIndex];
        let sNum = parseInt(selectedOpt.getAttribute("data-spieltag"));
        let datum = dateSelect.value;
        let gegnerTeam = selectedOpt.getAttribute("data-opponent");

        let endstand = document.getElementById("endergebnisTeam").value;
        let blockName = document.getElementById("block").value;
        let partieNum = document.getElementById("matchNumber").value;
        let isDoppel = blockName.toLowerCase().includes("doppel");

        let spielerKap = document.getElementById("playerKapellen").value;
        let gegnerName = document.getElementById("opponentPlayer").value;

        if (isDoppel) {
            let kap2 = document.getElementById("playerKapellen2").value;
            let geg2 = document.getElementById("opponentPlayer2").value;
            spielerKap = `${spielerKap} / ${kap2}`;
            gegnerName = `${gegnerName} / ${geg2}`;
        }

        let fullBlockName = `${blockName} (${partieNum})`;
        let ergebnis = document.getElementById("ergebnisSpiel").value;
        let avg = document.getElementById("avg").value;
        let darts = document.getElementById("darts").value.trim();

        let s60 = parseInt(document.getElementById("s60").value) || 0;
        let s80 = parseInt(document.getElementById("s80").value) || 0;
        let s100 = parseInt(document.getElementById("s100").value) || 0;
        let s140 = parseInt(document.getElementById("s140").value) || 0;
        let s180 = parseInt(document.getElementById("count180").value) || 0;
        let highFinish = parseInt(document.getElementById("hf").value) || 0;

        try {
            let { data: existingSt } = await supabaseClient.from('spieltage_t1').select('id').eq('spieltag_nummer', sNum).single();
            let spieltagId;
            if (!existingSt) {
                let { data: newSt, error: stErr } = await supabaseClient.from('spieltage_t1').insert([{ spieltag_nummer: sNum, datum: datum, gegner_team: gegnerTeam, endergebnis: endstand }]).select().single();
                if (stErr) throw stErr;
                spieltagId = newSt.id;
            } else {
                spieltagId = existingSt.id;
                await supabaseClient.from('spieltage_t1').update({ endergebnis: endstand, datum: datum, gegner_team: gegnerTeam }).eq('id', spieltagId);
            }

            let { data: newMatch, error: mErr } = await supabaseClient.from('matches_t1').insert([{
                spieltag_id: spieltagId, block_name: fullBlockName, spieler_kapellen: spielerKap,
                gegner_name: gegnerName, ergebnis: ergebnis, avg: avg ? parseFloat(avg) : null, darts: darts
            }]).select().single();
            if (mErr) throw mErr;

            let { error: sErr } = await supabaseClient.from('scoring_stats_t1').insert([{
                match_id: newMatch.id, score_60: s60, score_80: s80, score_100: s100, score_140: s140, score_180: s180, high_finish: highFinish
            }]);
            if (sErr) throw sErr;

            let msg = document.getElementById("successMsg");
            msg.style.display = "block";
            setTimeout(() => { msg.style.display = "none"; }, 3000);

            // Spieldaten & Scores für das nächste Match zurücksetzen (Rahmendaten bleiben erhalten)
            document.getElementById("ergebnisSpiel").value = "3:1";
            document.getElementById("avg").value = "";
            document.getElementById("darts").value = "";
            document.getElementById("s60").value = "0";
            document.getElementById("s80").value = "0";
            document.getElementById("s100").value = "0";
            document.getElementById("s140").value = "0";
            document.getElementById("count180").value = "0";
            document.getElementById("hf").value = "0";

        } catch (err) {
            alert("⚠️ Fehler beim Speichern: " + err.message);
        }
    }
</script>

</body>
</html>
